# =============================================================================
# ProfPay — конфиг для host nginx (profpay.site)
#
# На сервере несколько сайтов, поэтому здесь всё именованное: зоны лимитов
# с префиксом profpay_, кэш SSL-сессий отдельный. Иначе имена столкнутся
# с конфигами соседних сайтов и nginx откажется перезагружаться.
#
# Установка:
#   cp nginx/profpay.site.conf /etc/nginx/sites-available/profpay.site
#   ln -sf /etc/nginx/sites-available/profpay.site /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Строки limit_req_zone ДОЛЖНЫ лежать в http-контексте. Если ваш
# /etc/nginx/nginx.conf подключает sites-enabled внутри http (так по умолчанию
# в Ubuntu), оставьте их здесь. Иначе перенесите в nginx.conf.
# =============================================================================

# Перебор пароля: 5 попыток в минуту с адреса, всплеск до 5 без задержки.
# Это второй рубеж — учётная запись и так блокируется после 5 неудач,
# но лимит здесь отсекает перебор ещё до того, как запрос дойдёт до Python.
limit_req_zone $binary_remote_addr zone=profpay_login:10m rate=5r/m;
# Общий лимит на API, чтобы один клиент не занял все воркеры.
limit_req_zone $binary_remote_addr zone=profpay_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=profpay_conn:10m;

# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name profpay.site www.profpay.site;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://profpay.site$request_uri;
    }
}

# www → без www
server {
    listen 443 ssl;
    http2 on;
    server_name www.profpay.site;

    ssl_certificate     /etc/letsencrypt/live/profpay.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/profpay.site/privkey.pem;

    return 301 https://profpay.site$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # Отдельной директивой: в nginx 1.25+ `listen ... http2` объявлен устаревшим
    # и в 1.27 удалён — старая форма роняла бы nginx при обновлении.
    http2 on;

    server_name profpay.site;

    ssl_certificate     /etc/letsencrypt/live/profpay.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/profpay.site/privkey.pem;

    ssl_session_timeout 1d;
    ssl_session_cache shared:ProfPaySSL:10m;   # имя уникально среди сайтов
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    # Проверка сертификата по OCSP — браузеру не придётся ходить к УЦ самому.
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Остальные заголовки безопасности ставит само приложение
    # (backend/main.py, SecurityHeadersMiddleware) — дублировать их здесь
    # нельзя: add_header в nginx не заменит, а добавит второй такой же.

    client_max_body_size 4M;
    limit_conn profpay_conn 20;

    # В логи не должны попадать токены из строки запроса.
    access_log /var/log/nginx/profpay.access.log;
    error_log  /var/log/nginx/profpay.error.log warn;

    # Вход: жёсткий лимит на перебор пароля.
    location = /api/v1/auth/login {
        limit_req zone=profpay_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8020;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Восстановление пароля — тоже точка перебора адресов.
    location = /api/v1/auth/password-reset/request {
        limit_req zone=profpay_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8020;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=profpay_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8020;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;   # выгрузка Excel на тысяче записей
    }

    location / {
        proxy_pass http://127.0.0.1:8020;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8020/api/v1/health;
        access_log off;
    }

    # Скрытые файлы и бэкапы наружу не отдаём ни при каких обстоятельствах.
    location ~ /\.          { deny all; }
    location ~ \.(sql|dump|env)$ { deny all; }
}
