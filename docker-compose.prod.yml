# =============================================================================
# ProfPay — Production Docker Compose (VDS сервер)
# SSL обрабатывает HOST nginx, ProfPay слушает на 127.0.0.1:8020
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
# =============================================================================

services:
  # =============================================================================
  # PostgreSQL Database
  # =============================================================================
  db:
    image: postgres:15-alpine
    container_name: profpay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт наружу не публикуется: база доступна только контейнеру backend
    # по внутренней сети profpay-internal.
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - profpay-internal

  # =============================================================================
  # Backend API (FastAPI)
  # =============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: profpay-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      # Ключ шифрования персональных данных. Без него приложение не стартует.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@profpay.site}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      # Защита входа
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOGIN_LOCKOUT_MINUTES: ${LOGIN_LOCKOUT_MINUTES:-15}
      PUBLIC_URL: ${PUBLIC_URL:-https://profpay.site}
      CORS_ORIGINS: ${CORS_ORIGINS:-["https://profpay.site"]}
      TRUSTED_HOSTS: ${TRUSTED_HOSTS:-["profpay.site","localhost","127.0.0.1"]}
      # По умолчанию true — на боевом сервере иначе нельзя. Для локальной
      # проверки по HTTP переопределяется в .env: браузер не сохранит
      # secure-куку без HTTPS, и вход зациклится.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      DEBUG: ${DEBUG:-false}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          # На сервере живут и другие сайты — ограничиваем аппетит.
          memory: 512M
    networks:
      - profpay-internal

  # =============================================================================
  # Frontend (React + Internal Nginx)
  # Проксирует /api → backend, отдаёт React SPA
  # SSL снаружи через host nginx
  # =============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: profpay-frontend
    restart: unless-stopped
    ports:
      # Слушаем только петлевой интерфейс: наружу пускает host nginx.
      # На сервере несколько сайтов — порт вынесен в переменную,
      # чтобы развести их без правки этого файла.
      - "127.0.0.1:${PROFPAY_PORT:-8020}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # Явный 127.0.0.1, а не localhost: внутри контейнера имя резолвится
      # в IPv6 [::1], nginx слушает только IPv4, и busybox-wget (в отличие
      # от curl) не откатывается на IPv4 — контейнер вечно был unhealthy.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - profpay-internal

networks:
  profpay-internal:
    driver: bridge

volumes:
  postgres_data:
    driver: local
